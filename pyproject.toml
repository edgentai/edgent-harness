[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edgent-harness"
version = "0.1.0"
description = "General-purpose multimodal agent harness (standard library only) for a self-hosted OpenAI-compatible model server"
readme = "readme.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
harness = "harness.__main__:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
"harness.prompts" = ["*.md"]
