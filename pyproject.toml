[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edgent-harness"
version = "0.1.0"
description = "General-purpose, stdlib-only multimodal agent harness (interactive REPL, HTTP/SSE server, MCP, sandboxed tools & verified DAGs)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
harness = "harness.__main__:main"
edgent = "edgent.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
"harness.prompts" = ["*.md"]
